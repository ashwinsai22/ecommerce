version: '3.8'

services:
  # PostgreSQL for Identity Service
  postgres-identity:
    image: postgres:15-alpine
    container_name: krmarket-postgres-identity
    environment:
      POSTGRES_USER: krmarket
      POSTGRES_PASSWORD: krmarketpassword
      POSTGRES_DB: krmarket_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  # PostgreSQL for Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: krmarket-postgres-order
    environment:
      POSTGRES_USER: krmarket
      POSTGRES_PASSWORD: krmarketpassword
      POSTGRES_DB: krmarket_orders
    ports:
      - "5433:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  # MongoDB (Catalog & Review Services)
  mongodb:
    image: mongo:6.0
    container_name: krmarket-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis (Cart Service)
  redis:
    image: redis:7.0-alpine
    container_name: krmarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Zookeeper (for Kafka synchronization)
  zookeeper:
    image: zookeeper:3.9
    container_name: krmarket-zookeeper
    ports:
      - "2181:2181"

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: krmarket-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # Identity Microservice
  identity-service:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: krmarket-identity-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgres://krmarket:krmarketpassword@postgres-identity:5432/krmarket_identity
      - JWT_SECRET=CLIENT_SECRET_KEY
      - CLIENT_BASE_URL=http://localhost:5173
    depends_on:
      - postgres-identity

  # Catalog Microservice
  catalog-service:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: krmarket-catalog-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URL=mongodb://mongodb:27017/krmarket_catalog
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - mongodb
      - kafka

  # Cart Microservice
  cart-service:
    build:
      context: ./services/cart
      dockerfile: Dockerfile
    container_name: krmarket-cart-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Order Microservice
  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: krmarket-order-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DATABASE_URL=postgres://krmarket:krmarketpassword@postgres-order:5432/krmarket_orders
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - postgres-order
      - kafka

  # Search Microservice
  search-service:
    build:
      context: ./services/search
      dockerfile: Dockerfile
    container_name: krmarket-search-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka

volumes:
  postgres_identity_data:
  postgres_order_data:
  mongo_data:
  redis_data:
