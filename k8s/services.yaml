apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: krmarket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: ashwinsai22/kr-market-identity-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: DATABASE_URL
              value: "postgres://krmarket:krmarketpassword@postgres-identity:5432/krmarket_identity"
            - name: JWT_SECRET
              value: "CLIENT_SECRET_KEY"
            - name: CLIENT_BASE_URL
              value: "http://localhost:5173"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: krmarket
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: identity-service
---
