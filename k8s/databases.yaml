apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-identity
  namespace: krmarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-identity
  template:
    metadata:
      labels:
        app: postgres-identity
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: krmarket
            - name: POSTGRES_PASSWORD
              value: krmarketpassword
            - name: POSTGRES_DB
              value: krmarket_identity
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-identity
  namespace: krmarket
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-identity
---
